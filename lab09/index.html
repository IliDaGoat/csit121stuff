
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reads the XML data using JavaScript</title>

    <!-- CSS -->
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #7ce2af;
        }

        th {
            background-color: #7c0f65;
            color: white;
        }

        .button-container {
    text-align: center;
}

        .button {
            position: relative;
            text-align: center;
            padding: 20px;
            border: 4px solid rgb(55, 12, 211);
            background: rgba(20, 192, 4, 0.5);
            color: rgb(230, 36, 78);
            outline: none;
            border-radius: 30px;
            font-size: 30px;
            width: 500px;
        }

        .button:hover {
            color: black;
            background: white;
        }
    </style>

    <!--JavaScript-->
    <script>

        function loadXMLDoc() {
            let xmlhttp = new XMLHttpRequest();

            xmlhttp.onreadystatechange = function () {

                // Request finished and response
                // is ready and Status is "OK"
                if (this.readyState == 4 && this.status == 200) {
                    empDetails(this);
                }
            };

            // employee.xml is the external xml file
            xmlhttp.open("GET", "employee.xml", true);
            xmlhttp.send();
        }

        function empDetails(xml) {
            let i;
            let xmlDoc = xml.responseXML;

            let table =
                `<tr><th>Firstname</th><th>Lastname</th>
                    <th>Title</th><th>Division</th>
                    <th>Building</th><th>Room</th>
                </tr>`;

            let x = xmlDoc.getElementsByTagName("employee");

            // Start to fetch the data by using TagName
            for (i = 0; i < x.length; i++) {
                table += "<tr><td>" +
                    x[i].getElementsByTagName("firstname")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("lastname")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("title")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("division")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("building")[0]
                        .childNodes[0].nodeValue + "</td><td>" +
                    x[i].getElementsByTagName("room")[0]
                        .childNodes[0].nodeValue + "</td></tr>";
            }

            // Print the xml data in table form
            document.getElementById("employeeTable").innerHTML = table;
        }

        // AI assistance: Show and hide the employee table
        function toggleTable() {

            var table = document.getElementById("employeeTable");
            var button = document.getElementById("employeeButton");

            if (table.style.display == "none") {

                loadXMLDoc();

                table.style.display = "table";
                button.innerHTML = "Close Employee Data";

            } else {

                table.style.display = "none";
                button.innerHTML = "Get Employee Data";

            }

        }

    </script>
</head>

<body>

    <div class="button-container">
    <button type="button" class="button"
        id="employeeButton" onclick="toggleTable()">
        Get Employee Data
    </button>
</div>

    <br><br>

    <table id="employeeTable" style="display: none;"></table>

    <!-- AI Assistance Documentation -->
    <h1>AI Assistance</h1>

    <p>
        I used generative AI to help update my JavaScript code
        to allow the button to show and hide the employee table.
        The button text changes between "Get Employee Data"
        and "Close Employee Data" depending on its current state.
    </p>

</body>

</html>
