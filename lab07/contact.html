<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page </title>
    <link rel= "stylesheet" href="style.css">
</head>
<body>
    
    <h1>Fortnite Best Healings</h1>

     <nav>
        <a href="tierlist.html">Tier List</a> |
        <a href="contact.html">Contact</a>
    </nav>
    
     <h2>Share What You Think!!!</h2>

<form>

    <div>
        <label for="fname">Name:</label>
        <input type="text" id="fname" name="fname" required>
    </div>

    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
    </div>

    <p>1. What is your fav Fortnite healing item?</p>

    <input type="radio" id="Bandages" name="favorite" value="Bandages">
    <label for="Bandages">Bandages</label>

    <input type="radio" id="MedKit" name="favorite" value="Med kit">
    <label for="MedKit">Medkit</label>

    <input type="radio" id="Chugjug" name="favorite" value="Chugjug">
    <label for="Chugjug">Chugjug</label>

    <br><br>

    <p>2. Which is the worst healing item?</p>

    <input type="checkbox" id="Bandages-worst" name="worst" value="Bandages">
    <label for="Bandages-worst">Bandages</label>

    <input type="checkbox" id="Fish" name="worst" value="Fish">
    <label for="Fish">Fish</label>

    <input type="checkbox" id="Bannana" name="worst" value="Bannana">
    <label for="Bannana">Bannana</label>

    <br><br>

    <p>3. Are my ratings top tier!!!?</p>

    <label for="Choose">Choose:</label>

    <select id="Choose" name="Choose">
        <option value="">Choose an answer</option>
        <option value="Frick yeah">Frick yeah</option>
        <option value="Frick nah">Frick nah</option>
        <option value="Bunz rating">Bunz rating</option>
        <option value="No comment">No comment</option>
    </select>

    <br><br>

    <label for="comments">Any Additional Comments:</label>
    <textarea id="comments" name="comments"></textarea>

    <br><br>

    <input type="submit" value="Submit">

</form>



    
</body>
</html>
